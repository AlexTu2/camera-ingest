# footage-ingest.conf — edit these, then copy to ~/.config/footage-ingest.conf
# (the script also reads it from alongside itself, which is fine too)

# How the NAS is reached: a hostname, a Tailscale name, or a LAN IP behind a
# Tailscale subnet route (`ip route get <ip>` should show dev tailscale0).
NAS_HOST="nas.example"

# The NAS account rsync/ssh logs in as (key auth — rsync must never prompt).
NAS_USER="you"

# Dataset path AS SEEN ON THE NAS — this is an ssh/rsync target, not a local
# mount point. Each ingest batch becomes a subfolder here
# (e.g. .../ingest/2026-09-29_card1/). rsync only creates the final
# component, so this directory must already exist.
# ZFS tip: give this dataset recordsize=1M for large video files.
NAS_PATH="/mnt/tank/media/Videos/ingest"

# Where the card lands locally first. Everything else works from this copy.
STAGE_ROOT="$HOME/DaVinci Resolve Media/ingest"

# rsync --bwlimit for the NAS push. Keep this below your actual upload so the
# hotel wifi stays usable. 2M = 2 MiB/s ~= 16 Mbps. Use 0 for unlimited.
BWLIMIT="2M"

# 1 = build and verify sha256 manifests (recommended). 0 = skip all hashing.
HASH=1

# Extra places to look for a mounted card, if yours lands somewhere unusual.
# CARD_GLOBS=(/run/media/"$USER"/* /media/"$USER"/* /mnt/card)

# Immich tagging (immich-tag.sh only; the backup itself doesn't use these).
# The library ID is in the URL of Administration > External Libraries > the
# library. The API key goes in its own file, never in this one.
# IMMICH_URL="http://nas.example:2283"
# IMMICH_LIBRARY_ID="00000000-0000-0000-0000-000000000000"
# IMMICH_KEY_FILE="$HOME/.config/immich-api-key"
# IMMICH_TAG_ROOT="Camera"     # tags become Camera/Video, Camera/Photo, Camera/Edited
